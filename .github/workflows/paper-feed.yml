name: Update Scholar Paper Feed

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Mailbox look-back window"
        type: choice
        default: "30"
        options:
          - "7"
          - "30"
      publish:
        description: "Publish validated results to the site"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paper-feed-update
  cancel-in-progress: false

env:
  DEEPSEEK_MODEL: deepseek-v4-flash-vision-exp
  DEEPSEEK_BASE_URL: https://api.deepseek.com

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            paper_feed/requirements.txt
            tests/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Install paper-feed dependencies
        run: |
          pip install --requirement paper_feed/requirements.txt
          pip install --requirement tests/requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run browser-logic tests
        run: node --test tests/js/*.test.js

      - name: Read alerts and build a validated feed
        env:
          FOXMAIL_USERNAME: ${{ secrets.FOXMAIL_USERNAME }}
          FOXMAIL_IMAP_AUTH_CODE: ${{ secrets.FOXMAIL_IMAP_AUTH_CODE }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LOOKBACK_DAYS: ${{ github.event_name == 'schedule' && '7' || inputs.lookback_days }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          set -euo pipefail
          publish_flag="--no-publish"
          if [[ "$PUBLISH_REQUESTED" == "true" ]]; then
            publish_flag="--publish"
          fi
          python -m paper_feed.main \
            --source imap \
            --lookback-days "$LOOKBACK_DAYS" \
            "$publish_flag" \
            --preview-output "$RUNNER_TEMP/paper-feed-preview.json" \
            | tee "$RUNNER_TEMP/paper-feed-run-summary.json"

      - name: Add sanitized counts to the job summary
        env:
          RUN_SUMMARY_PATH: ${{ runner.temp }}/paper-feed-run-summary.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          allowed = (
              "matched_alerts", "candidates", "duplicates", "new", "summarized",
              "deferred", "metadata_only", "changed",
          )
          payload = json.loads(Path(os.environ["RUN_SUMMARY_PATH"]).read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Scholar Paper Feed\n\n")
              for key in allowed:
                  summary.write(f"- {key}: {payload[key]}\n")
          PY

      - name: Upload manual preview
        if: github.event_name == 'workflow_dispatch' && inputs.publish == false
        uses: actions/upload-artifact@v4
        with:
          name: paper-feed-preview
          path: ${{ runner.temp }}/paper-feed-preview.json
          retention-days: 3
          if-no-files-found: error

      - name: Build the production site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Commit generated data
        if: github.event_name == 'schedule' || inputs.publish == true
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/data/paper-feed.json paper_feed/state/retries.json; then
            exit 0
          fi
          python -c 'from paper_feed.store import load_feed, load_retries; load_feed("assets/data/paper-feed.json"); load_retries("paper_feed/state/retries.json")'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/data/paper-feed.json paper_feed/state/retries.json
          git commit -m "chore: update scholar paper feed"
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort
            exit 1
          fi
          python -c 'from paper_feed.store import load_feed, load_retries; load_feed("assets/data/paper-feed.json"); load_retries("paper_feed/state/retries.json")'
          git push origin HEAD:main
