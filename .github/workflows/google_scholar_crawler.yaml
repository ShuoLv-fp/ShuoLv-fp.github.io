name: Get Citation Data

on:
  # Weekly updates run locally through Codex; hosted runner IPs receive HTTP 403.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install requirements
        run: pip install --requirement google_scholar_crawler/requirements.txt curl_cffi==0.13.0
      - name: Check crawler dependencies and regressions
        if: false
        run: |
          python -c "from scholarly import scholarly; from bibtexparser.bibdatabase import BibDatabase"
          python -m unittest discover -s tests -p 'test_google_scholar_stats.py' -v
          node --test tests/js/google-scholar-stats.test.js
      - name: Fetch Google Scholar statistics
        working-directory: google_scholar_crawler
        run: python probe_cloud.py
        timeout-minutes: 5
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID || 'VAsm0T8AAAAJ' }}
      - name: Publish statistics
        if: false
        working-directory: google_scholar_crawler/results
        run: |
          git init
          git checkout -b google-scholar-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git commit -m "Updated Citation Data"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin google-scholar-stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
