name: Get Citation Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install beautifulsoup4 curl_cffi==0.13.0
      - run: python google_scholar_crawler/probe_direct.py
