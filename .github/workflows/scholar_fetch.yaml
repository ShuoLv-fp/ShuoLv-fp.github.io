name: Fetch a verified Scholar snapshot

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
    outputs:
      available:
        description: Whether this runner obtained a verified fresh profile
        value: ${{ jobs.fetch.outputs.available }}

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    outputs:
      available: ${{ steps.fetch.outputs.available }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install requirements
        run: pip install --requirement google_scholar_crawler/requirements.txt
      - name: Fetch Google Scholar statistics
        id: fetch
        working-directory: google_scholar_crawler
        timeout-minutes: 5
        env:
          SCHOLAR_FETCH_MODE: direct
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID || 'VAsm0T8AAAAJ' }}
        run: |
          if python main.py; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "This runner could not obtain a valid profile; the parent workflow must use another runner or fail." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload verified snapshot
        if: steps.fetch.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scholar-data-${{ inputs.runner }}
          path: |
            google_scholar_crawler/results/gs_data.json
            google_scholar_crawler/results/gs_data_shieldsio.json
          if-no-files-found: error
          retention-days: 3
