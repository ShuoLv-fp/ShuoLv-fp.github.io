<div class="paper-feed" data-paper-feed data-lang="{{ page.lang }}" data-feed-url="{{ site.baseurl }}/assets/data/paper-feed.json">
  <p class="paper-feed__status" data-paper-feed-status aria-live="polite">{% if page.lang == 'zh' %}正在加载论文…{% else %}Loading papers…{% endif %}</p>
  <div class="paper-feed__pager-slot" data-paper-feed-pager></div>
  <div class="paper-feed__days" data-paper-feed-days></div>
  <div class="paper-feed__pager-slot" data-paper-feed-pager></div>
</div>
