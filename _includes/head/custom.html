<link rel="shortcut icon" href="{{ site.baseurl }}/assets/icons/favicon-32x32_new.png">
<link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/assets/icons/apple-touch-icon_new.png">
<link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/assets/icons/favicon-32x32_new.png">
<link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/assets/icons/favicon-16x16_new.png">


<meta name="msapplication-TileColor" content="#000000">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/academicons.css"/>
<link rel="stylesheet" href="{{ site.baseurl }}/assets/css/collapse.css"/>

<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>
<script src="{{ site.baseurl }}/assets/js/collapse.js"></script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.author.name }}",
  "url": "{{ site.url }}/",
  "image": "{{ site.url }}/images/profile.png",
  "email": "mailto:{{ site.author.email }}",
  "jobTitle": "Master's Student",
  "description": "{{ site.description }}",
  "affiliation": {
    "@type": "Organization",
    "name": "Beijing Institute of Technology"
  },
  "alumniOf": {
    "@type": "Organization",
    "name": "Southwest University"
  },
  "sameAs": [
    "{{ site.author.googlescholar }}",
    "{{ site.author.orcid }}",
    "https://github.com/{{ site.author.github }}",
    "https://www.linkedin.com/in/{{ site.author.linkedin }}",
    "{{ site.author.bilibili }}",
    "{{ site.author.zhihu }}"
  ]
}
</script>

<!-- end custom head snippets -->
